name: Build & Release (macOS dmg)

# - push / PR: 테스트 + dmg 빌드 → Actions 아티팩트로 업로드
# - v* 태그 push (예: v2.1.0): 위 과정 + GitHub Release 를 만들고 dmg 첨부
# - main 에 push 했을 때 package.json 버전의 Release(v<version>)가 아직 없으면: 태그 + Release 를 자동으로
#   → 배포하려면 package.json 의 version 만 올려서 main 에 push 하면 돼요
# - Actions 탭 → Run workflow 에서 버전(예: 2.1.0)을 넣어도 태그 + Release 를 한 번에
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '배포할 버전 (예: 2.1.0). 비워 두면 빌드만 하고 Release 는 만들지 않아요'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Decide release version
        id: rel
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            v="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            # package.json 버전의 태그가 아직 없으면 새 버전으로 보고 배포
            pv=$(node -p "require('./package.json').version")
            if git ls-remote --exit-code --tags origin "refs/tags/v$pv" >/dev/null 2>&1; then v=""; else v="$pv"; fi
          else
            v=""
          fi
          if [[ -n "$v" && ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then echo "잘못된 버전: $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set app version
        if: steps.rel.outputs.version != ''
        run: npm version --no-git-tag-version "${{ steps.rel.outputs.version }}" --allow-same-version

      - name: Build dmg (Apple Silicon + Intel)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify ad-hoc signature
        run: |
          for app in dist/mac*/CodePup.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: CodePup-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.rel.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CodePup v${{ steps.rel.outputs.version }}
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            ## 설치
            1. Apple Silicon(M1~M4) 맥은 `arm64`, 인텔 맥은 `x64` dmg를 받으세요.
            2. dmg를 열고 **CodePup** 을 Applications 폴더로 드래그하세요.
            3. **꼭 한 번 터미널에서 실행하세요** (서명이 없는 앱이라 이걸 안 하면 "손상된 앱"으로 막혀요):
               ```
               xattr -cr /Applications/CodePup.app
               ```
            4. 메뉴 막대에 강아지 아이콘이 생기면 [Claude Code 연결]을 눌러 주세요.
            5. 처음 세션을 다시 열 때 macOS 가 권한을 물어보면 허용해 주세요.
               - **자동화**: iTerm · 터미널을 제어해서 세션을 탭으로 다시 열어요 (플러그인은 필요 없어요).
               - **손쉬운 사용** (macOS 기본 터미널만): 탭으로 열려고 ⌘T 를 보내요. 허용하지 않으면 새 창으로 열려요.
