<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>말 걸기</title>
  <link rel="stylesheet" href="prompt.css">
</head>
<body>
  <div class="bubble">
    <header>
      <img id="avatar" alt="">
      <b id="title">초코에게 부탁하기</b>
      <button id="close" class="icon" title="닫기 (Esc)">✕</button>
    </header>
    <div class="row">
      <select id="target"></select>
    </div>
    <div class="row" id="folder-row">
      <select id="folder"></select>
      <button id="pick" class="small" title="다른 폴더 고르기">📁</button>
    </div>
    <textarea id="text" rows="3" placeholder="무엇을 할까요? (Enter 보내기 · Shift+Enter 줄바꿈)"></textarea>
    <div class="foot">
      <span id="hint" class="hint"></span>
      <button id="send" class="primary">보내기</button>
    </div>
    <div id="error" class="error hidden"></div>
  </div>
  <script src="prompt.js"></script>
</body>
</html>
